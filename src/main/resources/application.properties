spring.application.name=BankApplication
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_app_main
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
account.transfer.limit = 50000
account.balance.limit = 0
account.savings.interest.rate = 2.5
account.transfer.fee = 0.02
