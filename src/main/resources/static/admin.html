<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank - Admin Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container auth-container-extra-wide">
        <div class="auth-card">
            <h1 class="brand brand-dark">Admin Portal</h1>
            <p id="welcome-message" class="welcome-message"></p>
            
            <div id="alert-box" class="alert hidden"></div>

            <div class="section-card-no-mt">
                <h3>Pending KYC Requests</h3>
                <div class="table-container">
                    <table id="kyc-table">
                        <thead>
                            <tr>
                                <th>Doc ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Submitted At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="section-card">
                <h3>Global Transactions</h3>
                <div class="table-container">
                    <table id="txn-table">
                        <thead>
                            <tr>
                                <th>Txn ID</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Fee</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <p class="toggle-text mt-30"><a href="#" id="logout-btn">Logout</a></p>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
